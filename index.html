    <title>DigiSkool-Institute of Digital Skills</title>
    <script>
      (function() {
        window.addEventListener('unhandledrejection', function(e) {
          var r = e.reason;
          var msg = (r && (r.message || r.stack || r)) ? String(r.message || r) : '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('without opened') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(e) {
          var msg = e.message || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('without opened') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
